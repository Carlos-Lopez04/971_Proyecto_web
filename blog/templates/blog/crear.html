{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>➕ Agregar Videojuego</title>
    <link rel="stylesheet" href="{% static 'blog/style.css' %}">
</head>
<body>
    <div class="container">
        <h1>➕ Agregar nuevo videojuego</h1>
        
        {% if error %}
            <div class="error-msg">{{ error }}</div>
        {% endif %}
        
        <form method="post" enctype="multipart/form-data" class="form-crear">
            {% csrf_token %}
            
            <label>🎮 Nombre del juego:</label>
            <input type="text" name="nombre" required placeholder="Ej: The Legend of Zelda">
            
            <label>📝 Descripción:</label>
            <textarea name="descripcion" rows="4" required placeholder="Describe el juego..."></textarea>
            
            <label>🏷️ Género:</label>
            <select name="genero">
                {% for codigo, nombre in generos %}
                    <option value="{{ codigo }}">{{ nombre }}</option>
                {% endfor %}
            </select>
            
            <label>🏢 Desarrolladora:</label>
            <input type="text" name="desarrollador" required placeholder="Ej: Nintendo">
            
            <label>📅 Fecha de lanzamiento:</label>
            <input type="date" name="fecha_lanzamiento" required>
            
            <label>🖼️ Imagen local (subir archivo):</label>
            <input type="file" name="imagen_local" accept="image/jpeg,image/png,image/webp">
            <small>Formatos: JPG, PNG, WEBP</small>
            
            <label>🔗 O URL de imagen externa:</label>
            <input type="url" name="imagen_url" placeholder="https://ejemplo.com/imagen.jpg">
            <small>Ejemplo: https://picsum.photos/400/300</small>
            
            <button type="submit">💾 Guardar videojuego</button>
            <a href="{% url 'listado_videojuegos' %}" class="btn-cancel">❌ Cancelar</a>
        </form>
    </div>
</body>
</html>
